<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>欢迎 - 库柯baby职位检索器</title>
    <link rel="stylesheet" href="/common.css" />
    <script src="/vendor/marked.min.js"></script>
    <style>
      .welcome-hero {
        background: linear-gradient(135deg, #1677ff 0%, #722ed1 100%);
        color: #fff;
        border-radius: var(--radius);
        padding: 40px 32px;
        margin-bottom: 24px;
      }
      .welcome-hero h1 {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .welcome-hero p {
        font-size: 15px;
        opacity: 0.9;
      }
      .readme-card {
        background: #fff;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 32px;
      }
      .readme-card h1 {
        text-align: center;
        font-size: 26px;
        margin-bottom: 16px;
      }
      /* markdown 内容样式 */
      .markdown-body {
        font-size: 15px;
        line-height: 1.7;
        color: var(--text);
        word-wrap: break-word;
      }
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4 {
        margin: 24px 0 12px;
        font-weight: 600;
        line-height: 1.3;
      }
      .markdown-body h1 {
        font-size: 24px;
        border-bottom: 1px solid var(--border-light);
        padding-bottom: 8px;
      }
      .markdown-body h2 {
        font-size: 20px;
        border-bottom: 1px solid var(--border-light);
        padding-bottom: 8px;
      }
      .markdown-body h3 {
        font-size: 17px;
      }
      .markdown-body p {
        margin: 12px 0;
      }
      .markdown-body ul,
      .markdown-body ol {
        padding-left: 24px;
        margin: 12px 0;
      }
      .markdown-body li {
        margin: 6px 0;
      }
      .markdown-body code {
        background: rgba(0, 0, 0, 0.06);
        border-radius: 4px;
        padding: 2px 6px;
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo,
          monospace;
        font-size: 13px;
      }
      .markdown-body pre {
        background: #f6f8fa;
        border-radius: 6px;
        padding: 16px;
        overflow-x: auto;
        margin: 16px 0;
      }
      .markdown-body pre code {
        background: transparent;
        padding: 0;
      }
      .markdown-body blockquote {
        border-left: 4px solid var(--border);
        padding: 8px 16px;
        margin: 16px 0;
        color: var(--text-secondary);
        background: #fafafa;
      }
      .markdown-body table {
        border-collapse: collapse;
        margin: 16px 0;
        width: 100%;
      }
      .markdown-body table th,
      .markdown-body table td {
        border: 1px solid var(--border);
        padding: 8px 12px;
        text-align: left;
      }
      .markdown-body table th {
        background: #fafafa;
        font-weight: 600;
      }
      .markdown-body img {
        max-width: 100%;
      }
      .markdown-body a {
        color: var(--primary);
      }
      .markdown-body hr {
        border: none;
        border-top: 1px solid var(--border-light);
        margin: 24px 0;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="logo">🔍 库柯baby职位检索器</div>
      <div class="nav">
        <a href="/welcome.html" class="active">欢迎</a>
        <a href="/jobs.html">职位检索</a>
      </div>
    </div>

    <div class="page-container">
      <div class="welcome-hero">
        <h1>欢迎使用 库柯baby职位检索器</h1>
        <p>用 AI 帮助你找到更适合你的好职位</p>
      </div>

      <div class="readme-card">
        <div id="readme-content" class="markdown-body">
          <div class="loading"><span class="spinner"></span>正在加载 README...</div>
        </div>
      </div>
    </div>

    <script>
      async function loadReadme() {
        try {
          const resp = await fetch('/README.md');
          if (!resp.ok) throw new Error('README 加载失败');
          const md = await resp.text();
          const html = marked.parse(md);
          document.getElementById('readme-content').innerHTML = html;
        } catch (err) {
          document.getElementById('readme-content').innerHTML =
            '<div class="error-msg">README 加载失败：' +
            (err.message || err) +
            '</div>';
        }
      }
      loadReadme();
    </script>
  </body>
</html>
