<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - 库柯baby职位检索器</title>
    <link rel="stylesheet" href="/common.css" />
    <style>
      body {
        background: #f0f2f5;
      }
      .login-container {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background-image: linear-gradient(
            135deg,
            rgba(22, 119, 255, 0.04) 0%,
            rgba(114, 46, 209, 0.04) 100%
          ),
          url('https://mdn.alipayobjects.com/yuyan_qk0oxh/afts/img/V-_oS6r-i7wAAAAAAAAAAAAAFl94AQBr');
        background-size: cover;
        background-position: center;
      }
      .login-body {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
        padding: 40px 32px 32px;
      }
      .login-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 32px;
      }
      .login-logo .logo-circle {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: linear-gradient(135deg, #1677ff, #722ed1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        color: #fff;
        margin-bottom: 16px;
      }
      .login-logo .site-title {
        font-size: 24px;
        font-weight: 600;
        color: var(--text);
      }
      .login-logo .site-slogan {
        font-size: 14px;
        color: var(--text-secondary);
        margin-top: 8px;
      }
      .form-item {
        margin-bottom: 24px;
      }
      .form-item label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--text);
      }
      .input-icon-wrap {
        position: relative;
      }
      .input-icon-wrap .icon {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-tertiary);
        font-size: 14px;
      }
      .input-icon-wrap .input {
        padding-left: 32px;
      }
      .login-btn {
        width: 100%;
        height: 44px;
        font-size: 16px;
        margin-top: 8px;
      }
      .login-footer {
        text-align: center;
        padding: 24px;
        color: var(--text-tertiary);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-body">
        <div class="login-card">
          <div class="login-logo">
            <div class="logo-circle">🔍</div>
            <div class="site-title">库柯baby职位检索器</div>
            <div class="site-slogan">用 AI 帮助你找到更适合你的好职位</div>
          </div>

          <form id="login-form">
            <div class="form-item">
              <label for="username">用户名</label>
              <div class="input-icon-wrap">
                <span class="icon">👤</span>
                <input
                  class="input"
                  id="username"
                  name="username"
                  type="text"
                  placeholder="请输入用户名"
                  autocomplete="username"
                />
              </div>
            </div>
            <div class="form-item">
              <label for="password">密码</label>
              <div class="input-icon-wrap">
                <span class="icon">🔒</span>
                <input
                  class="input"
                  id="password"
                  name="password"
                  type="password"
                  placeholder="请输入密码"
                  autocomplete="current-password"
                />
              </div>
            </div>
            <button type="submit" class="btn btn-primary login-btn">
              登录
            </button>
          </form>
        </div>
      </div>
      <div class="login-footer">库柯baby职位检索器 · 用 AI 帮助你找到更适合你的好职位</div>
    </div>

    <script>
      // 登录逻辑：仅保留 UI，不做校验，点击登录直接跳转到欢迎页
      document
        .getElementById('login-form')
        .addEventListener('submit', (e) => {
          e.preventDefault();
          // 支持 redirect 参数（参考 ant-design-pro 的 ?redirect=xxx）
          const urlParams = new URL(window.location.href).searchParams;
          const redirect = urlParams.get('redirect');
          // 安全校验：只允许站内相对路径
          if (redirect && redirect.startsWith('/') && !redirect.startsWith('//')) {
            window.location.href = redirect;
          } else {
            window.location.href = '/welcome.html';
          }
        });
    </script>
  </body>
</html>
